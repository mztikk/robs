[package]
name = "robs"
version = "0.2.2"
authors = ["Nils Feierabend <mztikk@outlook.de>"]
edition = "2024"
repository = "https://github.com/mztikk/robs"
license = "MIT"
description = "aob scanning"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
stringr = { version = "0.1.4" }
itertools = "0.14.0"
thiserror = "2.0.17"
rayon = "1.11.0"

[dev-dependencies]
criterion = "0.8.0"

[[bench]]
name = "benchmarks"
harness = false

[profile.bench]
lto = true
codegen-units = 1
strip = true
